server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker embedded DNS lets Nginx recover when the backend container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream backend:9000;

    # Laravel API, including protected incident and profile photo endpoints.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass $backend_upstream;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Support direct profile-photo URLs returned by the API.
    location ~ ^/users/[0-9]+/photo$ {
        include fastcgi_params;
        fastcgi_pass $backend_upstream;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI /api$request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Public files shared with the Laravel container.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    # React SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}